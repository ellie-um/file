    // ── Main Component ──
    function OhprintBusinessCardChat() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [step, setStep] = useState(0);
  const [isTyping, setIsTyping] = useState(false);
  const messagesEndRef = useRef(null);

  useEffect(() => {
    // 초기 메시지
    setTimeout(() => {
      addBotMessage({
        type: 'text',
        content: '안녕하세요 지은님 👋',
      });
    }, 400);
    setTimeout(() => {
      addBotMessage({
        type: 'text',
        content: '오늘은 어떤 걸 만들어드릴까요?',
      });
    }, 1200);
    setTimeout(() => {
      addBotMessage({
        type: 'chips',
        chips: ['명함', '스티커', '포스터', '브로슈어'],
        action: 'product'
      });
    }, 1800);
  }, []);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const addBotMessage = (msg) => {
    setMessages(prev => [...prev, { ...msg, sender: 'bot', id: Date.now() + Math.random() }]);
  };

  const addUserMessage = (content) => {
    setMessages(prev => [...prev, { type: 'text', content, sender: 'user', id: Date.now() + Math.random() }]);
  };

  const showTyping = (delay = 800) => {
    return new Promise(resolve => {
      setIsTyping(true);
      setTimeout(() => {
        setIsTyping(false);
        resolve();
      }, delay);
    });
  };

  const handleProductChoice = async (product) => {
    addUserMessage(product);
    setStep(1);
    await showTyping(900);
    addBotMessage({
      type: 'text',
      content: '명함을 만들어드릴게요. 디자인을 가지고 계세요?'
    });
    await new Promise(r => setTimeout(r, 400));
    addBotMessage({
      type: 'chips',
      chips: ['예, 업로드할게요', '아니요, 추천받을게요', '🔁 지난번 명함 그대로'],
      action: 'design'
    });
  };

  const handleDesignChoice = async (choice) => {
    addUserMessage(choice);
    setStep(2);
    await showTyping(1200);

    if (choice.includes('지난번')) {
      addBotMessage({
        type: 'last-order',
        title: '지난번 주문 (2025.11.14)',
        info: {
          name: '김지은',
          title: 'Senior Brand Designer',
          company: 'Studio Soft',
          phone: '010-XXXX-1234',
          email: 'jieun@studiosoft.kr',
          address: '서울 마포구 양화로 147',
          logo: 'STUDIO\nSOFT'
        }
      });
      await new Promise(r => setTimeout(r, 600));
      addBotMessage({
        type: 'text',
        content: '바뀐 정보가 있다면 알려주세요. 없으면 그대로 진행할게요.'
      });
      await new Promise(r => setTimeout(r, 400));
      addBotMessage({
        type: 'chips',
        chips: ['전번만 010-XXXX-5678로 바꿔줘', '그대로 진행해줘'],
        action: 'edit'
      });
    } else if (choice.includes('아니요')) {
      addBotMessage({
        type: 'text',
        content: '4가지 스타일을 보여드릴게요. 마음에 드는 톤을 골라주세요.'
      });
      addBotMessage({
        type: 'style-grid',
        action: 'style'
      });
    } else {
      addBotMessage({
        type: 'text',
        content: '디자인 파일을 업로드해주세요. AI / PSD / PNG / PDF 모두 가능합니다.'
      });
    }
  };

  const handleEdit = async (edit) => {
    addUserMessage(edit);
    setStep(3);
    await showTyping(1400);

    addBotMessage({
      type: 'text',
      content: edit.includes('전번') ? '전번만 010-XXXX-5678로 변경했어요.' : '입력하신 정보 그대로 시안을 만들었어요.'
    });
    await new Promise(r => setTimeout(r, 600));
    addBotMessage({
      type: 'preview',
      action: 'preview'
    });
  };

  const handlePreviewAction = async (action) => {
    if (action === 'order') {
      addUserMessage('주문할게요');
      setStep(4);
      await showTyping(900);
      addBotMessage({
        type: 'text',
        content: '내일 미팅이라고 하셨는데, 시간이 빠듯하네요. 익일 도착 옵션을 추천드려요.'
      });
      await new Promise(r => setTimeout(r, 500));
      addBotMessage({
        type: 'shipping',
        action: 'ship'
      });
    } else if (action === 'regen') {
      addUserMessage('다시 만들어줘');
      await showTyping(800);
      addBotMessage({
        type: 'text',
        content: '다른 시안으로 다시 만들어드릴게요.'
      });
      await new Promise(r => setTimeout(r, 800));
      addBotMessage({
        type: 'preview',
        action: 'preview',
        variant: 2
      });
    } else if (action === 'edit') {
      addUserMessage('직접 편집할게요');
      await showTyping(600);
      addBotMessage({
        type: 'editor-bridge'
      });
    }
  };

  const handleShipping = async (option) => {
    addUserMessage(option);
    setStep(5);
    await showTyping(700);
    addBotMessage({
      type: 'order-complete'
    });
  };

  const handleStyleChoice = async (style) => {
    addUserMessage(`'${style}' 스타일`);
    await showTyping(1200);
    addBotMessage({
      type: 'text',
      content: `${style} 스타일로 시안을 만들었어요.`
    });
    await new Promise(r => setTimeout(r, 600));
    addBotMessage({ type: 'preview', action: 'preview' });
  };

  return (
    <div className="ohp-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        .ohp-root {
          --ohp-bg: #FAFAFA;
          --ohp-fg: #0A0A0A;
          --ohp-muted: #6B6B6B;
          --ohp-line: #E5E5E5;
          --ohp-card: #FFFFFF;
          --ohp-accent: #FF4D1F;
          --ohp-accent-soft: #FFF0EB;
          --ohp-user-bg: #0A0A0A;

          font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
          background: var(--ohp-bg);
          color: var(--ohp-fg);
          min-height: 100vh;
          width: 100%;
          display: flex;
          flex-direction: column;
          letter-spacing: -0.01em;
          -webkit-font-smoothing: antialiased;
        }

        .ohp-header {
          border-bottom: 1px solid var(--ohp-line);
          background: var(--ohp-card);
          padding: 14px 20px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .ohp-brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .ohp-brand-mark {
          width: 32px; height: 32px;
          background: var(--ohp-fg);
          color: white;
          font-family: 'JetBrains Mono', monospace;
          font-weight: 700;
          font-size: 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          letter-spacing: -0.05em;
        }
        .ohp-brand-text {
          font-weight: 600;
          font-size: 15px;
        }
        .ohp-brand-text small {
          font-weight: 400;
          color: var(--ohp-muted);
          margin-left: 6px;
          font-size: 12px;
        }
        .ohp-step {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: var(--ohp-muted);
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        .ohp-chat {
          flex: 1;
          overflow-y: auto;
          padding: 24px 20px 100px;
          max-width: 720px;
          width: 100%;
          margin: 0 auto;
        }

        @media (max-width: 600px) {
          .ohp-chat { padding: 16px 14px 100px; }
        }

        .ohp-msg {
          margin-bottom: 14px;
          animation: ohp-in 0.4s ease-out both;
          max-width: 88%;
        }
        @keyframes ohp-in {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .ohp-msg.user {
          margin-left: auto;
        }
        .ohp-bubble {
          padding: 12px 16px;
          font-size: 15px;
          line-height: 1.5;
          border-radius: 4px;
        }
        .ohp-msg.bot .ohp-bubble {
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
        }
        .ohp-msg.user .ohp-bubble {
          background: var(--ohp-user-bg);
          color: white;
        }

        .ohp-typing {
          display: inline-flex;
          gap: 4px;
          padding: 14px 18px;
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
          border-radius: 4px;
        }
        .ohp-typing span {
          width: 6px; height: 6px;
          background: var(--ohp-muted);
          border-radius: 50%;
          animation: ohp-bounce 1.4s infinite ease-in-out;
        }
        .ohp-typing span:nth-child(2) { animation-delay: 0.2s; }
        .ohp-typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes ohp-bounce {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
          40% { transform: scale(1); opacity: 1; }
        }

        .ohp-chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 4px;
        }
        .ohp-chip {
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
          padding: 10px 16px;
          font-size: 14px;
          font-family: inherit;
          cursor: pointer;
          transition: all 0.18s ease;
          border-radius: 4px;
          color: var(--ohp-fg);
          font-weight: 500;
        }
        .ohp-chip:hover {
          border-color: var(--ohp-accent);
          color: var(--ohp-accent);
          transform: translateY(-1px);
        }
        .ohp-chip.featured {
          background: var(--ohp-accent-soft);
          border-color: var(--ohp-accent);
          color: var(--ohp-accent);
          font-weight: 600;
        }

        /* 지난 주문 카드 */
        .ohp-last {
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
          padding: 0;
          max-width: 100%;
          border-radius: 4px;
          overflow: hidden;
        }
        .ohp-last-head {
          padding: 12px 16px;
          background: var(--ohp-fg);
          color: white;
          font-size: 12px;
          font-family: 'JetBrains Mono', monospace;
          letter-spacing: 0.04em;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .ohp-last-body {
          padding: 16px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px 20px;
        }
        .ohp-last-row { font-size: 13px; }
        .ohp-last-row .lbl {
          color: var(--ohp-muted);
          font-size: 11px;
          font-family: 'JetBrains Mono', monospace;
          text-transform: uppercase;

        }
        .ohp-last-row .val {
          color: var(--ohp-fg);

        }
        .ohp-last-foot {
          padding: 12px 16px;
          border-top: 1px solid var(--ohp-line);

          font-size: 12px;

          align-items: center;

        }

        /* 스타일 그리드 */
        .ohp-styles {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 8px;
          margin-top: 8px;
        }
        .ohp-style {
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
          padding: 0;
          cursor: pointer;
          transition: all 0.2s;
          border-radius: 4px;
          overflow: hidden;
          aspect-ratio: 16/10;
          position: relative;
        }
        .ohp-style:hover {
          border-color: var(--ohp-accent);
          transform: translateY(-2px);
        }
        .ohp-style-card {
          width: 100%;
          height: 70%;
          display: flex;
          flex-direction: column;
          justify-content: space-between;

        .ohp-preview {

        }
        .ohp-card:hover {
          transform: rotate(0deg);
        }
        .ohp-card-name {
          font-family: 'Pretendard', sans-serif;
          font-size: 18px;
          font-weight: 700;

        }
        .ohp-card-title {

          letter-spacing: 0.05em;

        }
        .ohp-card-info {

        }
        .ohp-card-info .changed {

        }
        .ohp-card-logo {
          font-size: 16px;
          font-weight: 800;
          letter-spacing: -0.05em;

        }

        @media (min-width: 600px) {
          .ohp-preview-stage {
            flex-direction: row;
            justify-content: center;
            gap: 24px;
            padding: 40px 24px;
          }
        }

        .ohp-preview-actions {
          display: grid;
          grid-template-columns: 1fr 1fr 1fr;
          border-top: 1px solid var(--ohp-line);
        }
        .ohp-action {
          padding: 14px;
          background: var(--ohp-card);
          border: none;
          font-family: inherit;
          font-size: 13px;
          font-weight: 500;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          color: var(--ohp-fg);
          transition: background 0.15s;
        }
        .ohp-action:hover { background: var(--ohp-bg); }
        .ohp-action + .ohp-action { border-left: 1px solid var(--ohp-line); }
        .ohp-action.primary {
          background: var(--ohp-accent);
          color: white;
        }
        .ohp-action.primary:hover { background: #E63E15; }

        /* 배송 옵션 */
        .ohp-shipping {
          background: var(--ohp-card);
          border: 1px solid var(--ohp-line);
          border-radius: 4px;
          overflow: hidden;
        }
        .ohp-ship-opt {
          padding: 14px 16px;
          border: none;
          background: white;
          width: 100%;
          text-align: left;
          font-family: inherit;
          cursor: pointer;
          display: flex;
          justify-content: space-between;
          align-items: center;
          transition: background 0.15s;
          border-bottom: 1px solid var(--ohp-line);
        }
        .ohp-ship-opt:last-child { border-bottom: none; }
        .ohp-ship-opt:hover { background: var(--ohp-bg); }
        .ohp-ship-opt.recommended {
          background: var(--ohp-accent-soft);
          border-left: 3px solid var(--ohp-accent);
        }
        .ohp-ship-opt-info { display: flex; gap: 12px; align-items: flex-start; }
        .ohp-ship-opt-icon {
          width: 32px; height: 32px;
          background: var(--ohp-fg);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .ohp-ship-opt.recommended .ohp-ship-opt-icon {
          background: var(--ohp-accent);
        }
        .ohp-ship-opt-detail .name {
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 2px;
        }
        .ohp-ship-opt-detail .desc {
          font-size: 12px;
          color: var(--ohp-muted);
        }
        .ohp-ship-opt-price {
          font-family: 'JetBrains Mono', monospace;
          font-weight: 600;
          font-size: 14px;
        }

        /* 완료 */
        .ohp-complete {
          background: var(--ohp-fg);
          color: white;
          padding: 32px 24px;
          text-align: center;
          border-radius: 4px;
        }
        .ohp-complete-icon {
          width: 56px; height: 56px;
          background: var(--ohp-accent);
          color: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          margin: 0 auto 16px;
        }
        .ohp-complete h3 {
          font-size: 22px;
          margin: 0 0 8px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .ohp-complete p {
          font-size: 13px;
          opacity: 0.7;
          margin: 0;
        }
        .ohp-complete-meta {
          margin-top: 20px;
          padding-top: 20px;
          border-top: 1px solid rgba(255,255,255,0.15);
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
        }
        .ohp-complete-meta div { text-align: center; }
        .ohp-complete-meta .lbl { opacity: 0.5; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .ohp-complete-meta .val { font-weight: 700; }

        /* 입력창 */
        .ohp-input-wrap {
          position: fixed;
          bottom: 0; left: 0; right: 0;
          background: var(--ohp-card);
          border-top: 1px solid var(--ohp-line);
          padding: 12px 20px;
        }
        .ohp-input-inner {
          max-width: 720px;
          margin: 0 auto;
          display: flex;
          gap: 8px;
          align-items: center;
          background: var(--ohp-bg);
          padding: 8px 8px 8px 16px;
          border-radius: 4px;
          border: 1px solid var(--ohp-line);
        }
        .ohp-input-inner input {
          flex: 1;
          background: transparent;
          border: none;
          outline: none;
          font-family: inherit;
          font-size: 14px;
          color: var(--ohp-fg);
        }
        .ohp-input-inner button {
          width: 36px; height: 36px;
          background: var(--ohp-fg);
          color: white;
          border: none;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 2px;
          flex-shrink: 0;
        }

        /* 시간 압박 배지 */
        .ohp-deadline-badge {
          background: var(--ohp-fg);
          color: white;
          padding: 8px 12px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 4px;
        }

        .ohp-context-pill {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          padding: 3px 8px;
          background: var(--ohp-accent-soft);
          color: var(--ohp-accent);
          font-size: 10px;
          font-weight: 600;
          font-family: 'JetBrains Mono', monospace;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          margin-left: 6px;
        }

        .ohp-editor-bridge {
          background: var(--ohp-card);
          border: 1px dashed var(--ohp-line);
          padding: 24px;
          text-align: center;
          border-radius: 4px;
        }
        .ohp-editor-bridge p {
          margin: 8px 0 0;
          font-size: 12px;
          color: var(--ohp-muted);
        }
      `}</style>

      <header className="ohp-header">
        <div className="ohp-brand">
          <div className="ohp-brand-mark">O</div>
          <div className="ohp-brand-text">
            ohprint.me <small>AI Studio</small>
          </div>
        </div>
        <div className="ohp-step">Step {Math.min(step + 1, 6)}/6</div>
      </header>

      <main className="ohp-chat">
        {messages.map((msg, idx) => (
          <MessageRenderer
            key={msg.id}
            msg={msg}
            onProductChoice={handleProductChoice}
            onDesignChoice={handleDesignChoice}
            onEdit={handleEdit}
            onPreview={handlePreviewAction}
            onShipping={handleShipping}
            onStyle={handleStyleChoice}
          />
        ))}

        {isTyping && (
          <div className="ohp-msg bot">
            <div className="ohp-typing">
              <span></span><span></span><span></span>
            </div>
          </div>
        )}

        <div ref={messagesEndRef} />
      </main>

      <div className="ohp-input-wrap">
        <div className="ohp-input-inner">
          <input
            placeholder="메시지를 입력하세요..."
            value={input}
            onChange={(e) => setInput(e.target.value)}
            disabled
          />
          <button disabled><Send size={16} /></button>
        </div>
      </div>
    </div>
  );
}

function MessageRenderer({ msg, onProductChoice, onDesignChoice, onEdit, onPreview, onShipping, onStyle }) {
  if (msg.sender === 'user') {
    return (
      <div className="ohp-msg user">
        <div className="ohp-bubble">{msg.content}</div>
      </div>
    );
  }

  if (msg.type === 'text') {
    return (
      <div className="ohp-msg bot">
        <div className="ohp-bubble">{msg.content}</div>
      </div>
    );
  }

  if (msg.type === 'chips') {
    return (
      <div className="ohp-msg bot">
        <div className="ohp-chips">
          {msg.chips.map((chip, i) => (
            <button
              key={i}
              className={`ohp-chip ${chip.includes('🔁') ? 'featured' : ''}`}
              onClick={() => {
                if (msg.action === 'product') onProductChoice(chip);
                else if (msg.action === 'design') onDesignChoice(chip);
                else if (msg.action === 'edit') onEdit(chip);
                else if (msg.action === 'style') onStyle(chip);
              }}
            >
              {chip}
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (msg.type === 'last-order') {
    return (
      <div className="ohp-msg bot" style={{ maxWidth: '95%' }}>
        <div className="ohp-last">
          <div className="ohp-last-head">
            <span>📇 {msg.title}</span>
            <span style={{ opacity: 0.6 }}>50장 · 럭스 250g</span>
          </div>
          <div className="ohp-last-body">
            <div className="ohp-last-row">
              <div className="lbl">Name</div>
              <div className="val">{msg.info.name}</div>
            </div>
            <div className="ohp-last-row">
              <div className="lbl">Title</div>
              <div className="val">{msg.info.title}</div>
            </div>
            <div className="ohp-last-row">
              <div className="lbl">Company</div>
              <div className="val">{msg.info.company}</div>
            </div>
            <div className="ohp-last-row">
              <div className="lbl">Phone</div>
              <div className="val">{msg.info.phone}</div>
            </div>
            <div className="ohp-last-row">
              <div className="lbl">Email</div>
              <div className="val">{msg.info.email}</div>
            </div>
            <div className="ohp-last-row">
              <div className="lbl">Address</div>
              <div className="val">{msg.info.address}</div>
            </div>
          </div>
          <div className="ohp-last-foot">
            <Sparkles size={14} />
            8개 항목을 자동으로 채웠어요
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'preview') {
    const isV2 = msg.variant === 2;
    return (
      <div className="ohp-msg bot" style={{ maxWidth: '100%' }}>
        <div className="ohp-preview">
          <div className="ohp-preview-head">
            <h3>실물 프리뷰 {isV2 ? '· Variant 2' : ''}</h3>
            <span className="badge">3.2초 만에 생성</span>
          </div>
          <div className="ohp-preview-stage">
            <div className="ohp-card" style={isV2 ? { background: '#FFF8F0' } : {}}>
              <div>
                <div className="ohp-card-name">김지은</div>
                <div className="ohp-card-title">Senior Brand Designer</div>
              </div>
              <div className="ohp-card-info">
                Studio Soft<br/>
                <span className="changed">010-XXXX-5678</span><br/>
                jieun@studiosoft.kr<br/>
                서울 마포구 양화로 147
              </div>
            </div>
            <div className="ohp-card back">
              <div className="ohp-card-logo">
                STUDIO<br/>SOFT
              </div>
            </div>
          </div>
          <div className="ohp-preview-actions">
            <button className="ohp-action" onClick={() => onPreview('regen')}>
              <RotateCcw size={14} /> 다시
            </button>
            <button className="ohp-action" onClick={() => onPreview('edit')}>
              <Edit3 size={14} /> 편집
            </button>
            <button className="ohp-action primary" onClick={() => onPreview('order')}>
              <Check size={14} /> 주문하기
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'shipping') {
    return (
      <div className="ohp-msg bot" style={{ maxWidth: '95%' }}>
        <div style={{ marginBottom: 8 }}>
          <span className="ohp-deadline-badge">
            <Clock size={11} />
            내일 14:00 미팅 인식됨
          </span>
        </div>
        <div className="ohp-shipping">
          <button className="ohp-ship-opt recommended" onClick={() => onShipping('익일 도착')}>
            <div className="ohp-ship-opt-info">
              <div className="ohp-ship-opt-icon"><Truck size={16} /></div>
              <div className="ohp-ship-opt-detail">
                <div className="name">
                  익일 도착
                  <span className="ohp-context-pill">AI 추천</span>
                </div>
                <div className="desc">내일 오전 10시 도착 · 미팅 전 도착 보장</div>
              </div>
            </div>
            <div className="ohp-ship-opt-price">+5,000</div>
          </button>
          <button className="ohp-ship-opt" onClick={() => onShipping('일반 배송')}>
            <div className="ohp-ship-opt-info">
              <div className="ohp-ship-opt-icon"><Package size={16} /></div>
              <div className="ohp-ship-opt-detail">
                <div className="name">일반 배송</div>
                <div className="desc">2~3일 소요</div>
              </div>
            </div>
            <div className="ohp-ship-opt-price">+0</div>
          </button>
        </div>
      </div>
    );
  }

  if (msg.type === 'order-complete') {
    return (
      <div className="ohp-msg bot" style={{ maxWidth: '100%' }}>
        <div className="ohp-complete">
          <div className="ohp-complete-icon">
            <Check size={28} strokeWidth={3} />
          </div>
          <h3>주문 완료</h3>
          <p>편집기를 한 번도 열지 않고 4분 12초 만에 완성</p>
          <div className="ohp-complete-meta">
            <div>
              <div className="lbl">Order</div>
              <div className="val">#2026-A0431</div>
            </div>
            <div>
              <div className="lbl">Quantity</div>
              <div className="val">50ea</div>
            </div>
            <div>
              <div className="lbl">Arrival</div>
              <div className="val">내일 10:00</div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'editor-bridge') {
    return (
      <div className="ohp-msg bot">
        <div className="ohp-editor-bridge">
          <Edit3 size={20} style={{ color: 'var(--ohp-muted)' }} />
          <p>편집기로 이동합니다. 시안은 그대로 로드됩니다.</p>
        </div>
      </div>
    );
  }

  if (msg.type === 'style-grid') {
    const styles = [
      { label: 'MINIMAL', bg: '#fff', fg: '#000', accent: '#000' },
      { label: 'BOLD', bg: '#FF4D1F', fg: '#fff', accent: '#fff' },
      { label: 'EDITORIAL', bg: '#F5F0E8', fg: '#1a1a1a', accent: '#8B6F47' },
      { label: 'MONO', bg: '#1a1a1a', fg: '#fff', accent: '#fff' },
    ];
    return (
      <div className="ohp-msg bot" style={{ maxWidth: '95%' }}>
        <div className="ohp-styles">
          {styles.map((s, i) => (
            <button key={i} className="ohp-style" onClick={() => onStyle(s.label)}>
              <div className="ohp-style-card" style={{ background: s.bg, color: s.fg }}>
                <div style={{ fontSize: 13, fontWeight: 700 }}>김지은</div>
                <div style={{ width: 30, height: 2, background: s.accent }}></div>
              </div>
              <div className="ohp-style-label">{s.label}</div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return null;
}


    ReactDOM.createRoot(document.getElementById('root')).render(<OhprintBusinessCardChat />);
  </script>
