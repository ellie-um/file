    // ── Main Component ──
    function SnapsGoodsChat() {
  const [messages, setMessages] = useState([]);
  const [step, setStep] = useState(0);
  const [isTyping, setIsTyping] = useState(false);
  const [selected, setSelected] = useState(new Set()); // 시안 그리드 선택
  const [quantities, setQuantities] = useState({ keyring: 30, stand: 10, case: 15, badge: 25 });
  const messagesEndRef = useRef(null);

  useEffect(() => {
    setTimeout(() => addBotMessage({ type: 'text', content: '안녕하세요 민호님 ✨' }), 400);
    setTimeout(() => addBotMessage({ type: 'text', content: '오늘은 어떤 굿즈를 만들어볼까요?' }), 1200);
    setTimeout(() => addBotMessage({
      type: 'free-input',
      placeholder: '예) 이번 주말 마켓에 들고 갈 굿즈 4종',
      suggestions: [
        '🎪 마켓 출품용 굿즈',
        '🎁 팬 선물용 굿즈',
        '✨ 신작 IP 시즌 굿즈',
        '직접 입력하기'
      ],
      action: 'intent'
    }), 1800);
  }, []);

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const addBotMessage = (msg) => {
    setMessages(prev => [...prev, { ...msg, sender: 'bot', id: Date.now() + Math.random() }]);
  };

  const addUserMessage = (content) => {
    setMessages(prev => [...prev, { type: 'text', content, sender: 'user', id: Date.now() + Math.random() }]);
  };

  const showTyping = (delay = 800) => {
    return new Promise(resolve => {
      setIsTyping(true);
      setTimeout(() => {
        setIsTyping(false);
        resolve();
      }, delay);
    });
  };

  const handleIntent = async (intent) => {
    addUserMessage("이번 주말 마켓에 들고 갈 'Bunny Doodle' 굿즈 4종 만들고 싶어");
    setStep(1);
    await showTyping(1200);
    addBotMessage({
      type: 'text',
      content: '마켓 일정을 기억해둘게요 📅 어떤 굿즈를 만들지 골라주세요. 여러 개 선택할 수 있어요.'
    });
    await new Promise(r => setTimeout(r, 400));
    addBotMessage({ type: 'goods-picker', action: 'goods' });
  };

  const handleGoodsConfirm = async (selectedGoods) => {
    addUserMessage(`${selectedGoods.join(' · ')} 4종 모두 선택`);
    setStep(2);
    await showTyping(1100);
    addBotMessage({
      type: 'text',
      content: '아트웍 파일을 한 번에 업로드해주세요. PNG · JPG · PSD · AI 모두 OK 👌'
    });
    await new Promise(r => setTimeout(r, 400));
    addBotMessage({ type: 'upload-zone', action: 'upload' });
  };

  const handleUpload = async () => {
    addUserMessage("'Bunny Doodle' 캐릭터 8종 일괄 업로드");
    setStep(3);
    await showTyping(1100);
    addBotMessage({ type: 'ai-process' });
    await new Promise(r => setTimeout(r, 3200));
    addBotMessage({
      type: 'text',
      content: '✨ 4종 × 8캐릭터 = 32개 시안을 만들었어요! 굿즈별로 마음에 드는 디자인을 골라주세요.'
    });
    await new Promise(r => setTimeout(r, 600));
    addBotMessage({ type: 'design-grid', action: 'grid' });
  };

  const handleGridConfirm = async () => {
    addUserMessage(`키링 5종 · 등신대 2종 · 폰케이스 3종 · 핀뱃지 4종 선택 (총 ${selected.size}종)`);
    setStep(4);
    await showTyping(900);
    addBotMessage({
      type: 'text',
      content: '굿즈별 수량을 정해주세요. 마켓이 토요일이라고 하셨으니 금요일 도착 옵션도 함께 추천드려요.'
    });
    await new Promise(r => setTimeout(r, 400));
    addBotMessage({ type: 'quantity-shipping', action: 'qs' });
  };

  const handleOrder = async () => {
    addUserMessage('한 번에 주문할게요');
    setStep(5);
    await showTyping(1100);
    addBotMessage({ type: 'order-complete' });
  };

  return (
    <div className="snpg-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Caveat:wght@400;700&display=swap');

        .snpg-root {
          --snpg-bg: #FFF9F0;
          --snpg-bg-2: #FFEEDD;
          --snpg-fg: #1A1814;
          --snpg-fg-soft: #5C5550;
          --snpg-muted: #9A938C;
          --snpg-line: #F0E5D2;
          --snpg-card: #FFFFFF;
          --snpg-accent: #FF6B35;
          --snpg-accent-2: #FFB627;
          --snpg-accent-soft: #FFE8DC;
          --snpg-bunny: #FFB6C1;
          --snpg-bunny-2: #FF8FA3;
          --snpg-user-bg: #1A1814;

          font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
          background: var(--snpg-bg);
          color: var(--snpg-fg);
          min-height: 100vh;
          width: 100%;
          display: flex;
          flex-direction: column;
          letter-spacing: -0.01em;
          -webkit-font-smoothing: antialiased;
          background-image: radial-gradient(circle at 20% 10%, var(--snpg-bg-2) 0%, transparent 25%),
                            radial-gradient(circle at 80% 70%, var(--snpg-accent-soft) 0%, transparent 30%);
        }

        .snpg-header {
          background: var(--snpg-card);
          border-bottom: 2px solid var(--snpg-fg);
          padding: 14px 20px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .snpg-brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .snpg-brand-mark {
          font-family: 'Caveat', cursive;
          font-size: 32px;
          font-weight: 700;
          color: var(--snpg-accent);
          line-height: 1;
        }
        .snpg-brand-text {
          font-size: 12px;
          color: var(--snpg-fg-soft);
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.1em;
        }
        .snpg-brand-text small {
          background: var(--snpg-fg);
          color: var(--snpg-bg-2);
          padding: 2px 6px;
          font-size: 9px;
          margin-left: 4px;
          font-family: 'Space Mono', monospace;
          letter-spacing: 0.05em;
        }
        .snpg-step {
          font-family: 'Space Mono', monospace;
          font-size: 11px;
          color: var(--snpg-fg);
          letter-spacing: 0.05em;
          background: var(--snpg-accent-2);
          padding: 4px 10px;
          font-weight: 700;
        }

        .snpg-chat {
          flex: 1;
          overflow-y: auto;
          padding: 20px 16px 100px;
          max-width: 760px;
          width: 100%;
          margin: 0 auto;
        }

        .snpg-msg {
          margin-bottom: 14px;
          animation: snpg-pop 0.45s cubic-bezier(0.34, 1.3, 0.64, 1) both;
          max-width: 90%;
        }
        @keyframes snpg-pop {
          from { opacity: 0; transform: translateY(12px) scale(0.96); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .snpg-msg.user { margin-left: auto; }

        .snpg-bubble {
          padding: 12px 18px;
          font-size: 15px;
          line-height: 1.55;
          border-radius: 18px;
          font-weight: 500;
        }
        .snpg-msg.bot .snpg-bubble {
          background: var(--snpg-card);
          border: 2px solid var(--snpg-fg);
          border-top-left-radius: 4px;
          box-shadow: 4px 4px 0 var(--snpg-fg);
        }
        .snpg-msg.user .snpg-bubble {
          background: var(--snpg-fg);
          color: var(--snpg-bg);
          border-top-right-radius: 4px;
        }

        .snpg-typing {
          display: inline-flex;
          gap: 5px;
          padding: 14px 18px;
          background: var(--snpg-card);
          border: 2px solid var(--snpg-fg);
          border-radius: 18px;
          border-top-left-radius: 4px;
          box-shadow: 4px 4px 0 var(--snpg-fg);
        }
        .snpg-typing span {
          width: 8px; height: 8px;
          background: var(--snpg-accent);
          border-radius: 50%;
          animation: snpg-bounce 1.2s infinite;
        }
        .snpg-typing span:nth-child(2) { animation-delay: 0.15s; background: var(--snpg-accent-2); }
        .snpg-typing span:nth-child(3) { animation-delay: 0.3s; background: var(--snpg-bunny-2); }
        @keyframes snpg-bounce {
          0%, 80%, 100% { transform: translateY(0); }
          40% { transform: translateY(-6px); }
        }

        .snpg-chips {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-top: 4px;
        }
        .snpg-chip {
          background: var(--snpg-card);
          border: 2px solid var(--snpg-fg);
          padding: 9px 14px;
          font-size: 14px;
          font-family: inherit;
          cursor: pointer;
          transition: all 0.15s;
          border-radius: 20px;
          color: var(--snpg-fg);
          font-weight: 600;
          box-shadow: 2px 2px 0 var(--snpg-fg);
        }
        .snpg-chip:hover {
          background: var(--snpg-accent-2);
          transform: translate(-2px, -2px);
          box-shadow: 4px 4px 0 var(--snpg-fg);
        }

        .snpg-free {
          background: var(--snpg-card);
          border: 2px solid var(--snpg-fg);
          border-radius: 18px;
          border-top-left-radius: 4px;
          padding: 14px;
          box-shadow: 4px 4px 0 var(--snpg-fg);
        }
        .snpg-free-hint {
          font-family: 'Caveat', cursive;
          font-size: 18px;
          color: var(--snpg-accent);
          margin-bottom: 10px;
          padding-left: 4px;
        }

        /* 굿즈 픽커 */
        .snpg-goods {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
          margin-bottom: 12px;
        }
        @media (max-width: 480px) {
          .snpg-goods { grid-template-columns: repeat(2, 1fr); }
        }
        .snpg-good {
          background: var(--snpg-card);
          border: 2px solid var(--snpg-fg);
          border-radius: 12px;
          padding: 14px 10px;
          cursor: pointer;
          transition: all 0.15s;
          text-align: center;
          font-family: inherit;
          box-shadow: 3px 3px 0 var(--snpg-fg);
          position: relative;
        }
        .snpg-good:hover {
          transform: translate(-1px, -1px);
          box-shadow: 4px 4px 0 var(--snpg-fg);
        }
        .snpg-good.selected {
          background: var(--snpg-accent);
          color: white;
        }
        .snpg-good-shape {
          width: 40px; height: 40px;
          margin: 0 auto 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: var(--snpg-bg-2);
          border-radius: 50%;
        }
        .snpg-good.selected .snpg-good-shape {
          background: rgba(255,255,255,0.3);
        }
        .snpg-good-name {
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 2px;
        }
        .snpg-good-desc {
          font-size: 10px;
          opacity: 0.7;
        }
        .snpg-good-check {
          position: absolute;
          top: 6px; right: 6px;
          width: 18px; height: 18px;
          background: var(--snpg-fg);
          color: white;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .snpg-good.selected .snpg-good-check { opacity: 1; }

        .snpg-confirm-btn {
          width: 100%;
          background: var(--snpg-fg);
          color: white;
          border: none;
          padding: 14px;
          font-family: inherit;
          font-size: 14px;
          font-weight: 700;
          cursor: pointer;
          border-radius: 12px;
          letter-spacing: -0.01em;
        }
        .snpg-confirm-btn:hover { background: var(--snpg-accent); }
        .snpg-confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 업로드 존 */
        .snpg-upload {
          background: var(--snpg-card);
          border: 2px dashed var(--snpg-fg);
          border-radius: 16px;
          padding: 28px 20px;
          text-align: center;
          cursor: pointer;

function GoodsMessage({ msg, selected, setSelected, quantities, setQuantities, onIntent, onGoodsConfirm, onUpload, onGridConfirm, onOrder }) {
  const [chosen, setChosen] = useState(new Set());

  if (msg.sender === 'user') {
    return <div className="snpg-msg user"><div className="snpg-bubble">{msg.content}</div></div>;
  }

  if (msg.type === 'text') {
    return <div className="snpg-msg bot"><div className="snpg-bubble">{msg.content}</div></div>;
  }

  if (msg.type === 'free-input') {
    return (
      <div className="snpg-msg bot" style={{ maxWidth: '95%' }}>
        <div className="snpg-free">
          <div className="snpg-free-hint">{msg.placeholder}</div>
          <div className="snpg-chips">
            {msg.suggestions.map((s, i) => (
              <button key={i} className="snpg-chip" onClick={() => onIntent(s)}>{s}</button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'goods-picker') {
    const goods = [
      { key: 'keyring', name: '아크릴 키링', desc: '40 × 40mm', emoji: '🔑' },
      { key: 'stand', name: '아크릴 등신대', desc: '미니/대형', emoji: '🎎' },
      { key: 'case', name: '폰케이스', desc: '맞춤 모델', emoji: '📱' },
      { key: 'badge', name: '핀뱃지', desc: 'Ø44mm', emoji: '🎖️' },
      { key: 'smarttok', name: '스마트톡', desc: '회전형', emoji: '✨' },
      { key: 'banner', name: '미니배너', desc: '20×40cm', emoji: '🚩' },
    ];
    const toggle = (k) => {
      const s = new Set(chosen);
      if (s.has(k)) s.delete(k); else s.add(k);
      setChosen(s);
    };
    const initialFour = ['keyring', 'stand', 'case', 'badge'];
    return (
      <div className="snpg-msg bot" style={{ maxWidth: '100%' }}>
        <div className="snpg-goods">
          {goods.map((g) => {
            const isOn = chosen.has(g.key) || (chosen.size === 0 && initialFour.includes(g.key));
            return (
              <button key={g.key} className={`snpg-good ${isOn ? 'selected' : ''}`} onClick={() => toggle(g.key)}>
                <div className="snpg-good-shape">{g.emoji}</div>
                <div className="snpg-good-name">{g.name}</div>
                <div className="snpg-good-desc">{g.desc}</div>
                <div className="snpg-good-check"><Check size={11} strokeWidth={3}/></div>
              </button>
            );
          })}
        </div>
        <button className="snpg-confirm-btn" onClick={() => {
          const final = chosen.size > 0 ? [...chosen] : initialFour;
          onGoodsConfirm(final.map(k => goods.find(g => g.key === k).name));
        }}>
          {chosen.size > 0 ? `${chosen.size}종 선택 완료` : '4종 모두 선택 (기본)'} →
        </button>
      </div>
    );
  }

  if (msg.type === 'upload-zone') {
    return (
      <div className="snpg-msg bot" style={{ maxWidth: '95%' }}>
        <button className="snpg-upload" onClick={onUpload}>
          <div className="snpg-upload-icon"><Upload size={24} /></div>
          <div className="snpg-upload-text">아트웍 일괄 업로드</div>
          <div className="snpg-upload-sub">PNG · JPG · PSD · AI · SVG</div>
        </button>
      </div>
    );
  }

  if (msg.type === 'ai-process') {
    return (
      <div className="snpg-msg bot" style={{ maxWidth: '90%' }}>
        <div className="snpg-process">
          <div className="snpg-process-title">
            <Sparkles size={20} />
            AI가 작업 중...
          </div>
          <div className="snpg-process-step">
            <div className="check">✓</div>
            <span>① 누끼 자동 제거 (8/8)</span>
          </div>
          <div className="snpg-process-step">
            <div className="check">✓</div>
            <span>② 굿즈별 사이즈 매칭</span>
          </div>
          <div className="snpg-process-step">
            <div className="check">✓</div>
            <span>③ 칼선 자동 생성</span>
          </div>
          <div className="snpg-process-step pending">
            <div className="check">◌</div>
            <span>④ 캐릭터-굿즈 최적 매칭...</span>
          </div>
          <div className="snpg-process-counter">
            4종 × 8캐릭터 = 32개 시안 생성 중
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'design-grid') {
    const products = [
      { key: 'keyring', name: '🔑 아크릴 키링', count: 8, recommendation: '캐릭터 단독' },
      { key: 'stand', name: '🎎 아크릴 등신대', count: 8, recommendation: '풀바디 비율' },
      { key: 'case', name: '📱 폰케이스', count: 8, recommendation: '여백 활용' },
      { key: 'badge', name: '🎖️ 핀뱃지', count: 8, recommendation: '원형 크롭' },
    ];
    const targetCount = { keyring: 5, stand: 2, case: 3, badge: 4 };
    const toggle = (productKey, idx) => {
      const id = `${productKey}-${idx}`;
      const s = new Set(selected);
      if (s.has(id)) s.delete(id); else s.add(id);
      setSelected(s);
    };
    const isSelected = (productKey, idx) => {
      const id = `${productKey}-${idx}`;
      // 기본 선택 상태
      const defaults = {
        keyring: [0, 1, 4, 6, 7],
        stand: [0, 6],
        case: [0, 2, 6],
        badge: [0, 1, 4, 6],
      };
      if (selected.size === 0) {
        return defaults[productKey]?.includes(idx);
      }
      return selected.has(id);
    };

    return (
      <div className="snpg-msg bot" style={{ maxWidth: '100%' }}>
        <div className="snpg-grid-wrap">
          <div className="snpg-grid-head">
            <h3>32개 시안 그리드</h3>
            <span className="meta">AI 자동 생성 · 1.4s</span>
          </div>

          {products.map((p) => {
            const productSelected = [...Array(p.count)].filter((_, i) => isSelected(p.key, i)).length;
            return (
              <div key={p.key} className="snpg-product-section">
                <div className="snpg-product-head">
                  <h4>{p.name}</h4>
                  <span className="count">{productSelected || targetCount[p.key]}종 선택 · {p.recommendation}</span>
                </div>
                <div className="snpg-design-grid">
                  {[...Array(p.count)].map((_, i) => (
                    <div
                      key={i}
                      className={`snpg-design ${p.key} ${isSelected(p.key, i) ? 'selected' : ''}`}
                      onClick={() => toggle(p.key, i)}
                    >
                      <div className="snpg-design-check"><Check size={11} strokeWidth={3} /></div>
                      <div className="snpg-bunny-art">
                        <BunnyArt variant={i} dark={p.key === 'case'} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}

          <div className="snpg-grid-foot">
            <div className="summary">
              총 <span className="num">14</span>종의 디자인 선택됨
            </div>
            <button className="snpg-confirm-btn" style={{ width: 'auto', padding: '12px 22px' }} onClick={onGridConfirm}>
              수량 정하러 가기 →
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (msg.type === 'quantity-shipping') {
    const items = [
      { key: 'keyring', name: '아크릴 키링', sub: '5종 × ', emoji: '🔑', price: 4500 },
      { key: 'stand', name: '아크릴 등신대', sub: '2종 × ', emoji: '🎎', price: 8000 },
      { key: 'case', name: '폰케이스', sub: '3종 × ', emoji: '📱', price: 12000 },
      { key: 'badge', name: '핀뱃지', sub: '4종 × ', emoji: '🎖️', price: 2500 },
    ];

    const updateQty = (key, delta) => {
      setQuantities(prev => ({ ...prev, [key]: Math.max(1, prev[key] + delta) }));
    };

    const total = items.reduce((sum, item) => sum + (quantities[item.key] * item.price), 0);

    return (
      <div className="snpg-msg bot" style={{ maxWidth: '100%' }}>
        <div className="snpg-qs">
          <div className="snpg-qs-deadline">
            <Calendar size={14} />
            <span>마켓 일정: 토요일 (이번 주말)</span>
            <strong>금요일까지 도착 필요</strong>
          </div>

          <div className="snpg-qs-list">
            {items.map((item) => (
              <div key={item.key} className="snpg-qs-row">
                <div className="snpg-qs-icon">{item.emoji}</div>
                <div className="snpg-qs-name">
                  {item.name}
                  <div className="sub">{item.sub}{quantities[item.key]}개씩</div>
                </div>
                <div className="snpg-qs-counter">
                  <button onClick={() => updateQty(item.key, -1)}><Minus size={11} /></button>
                  <span className="num">{quantities[item.key]}</span>
                  <button onClick={() => updateQty(item.key, 1)}><Plus size={11} /></button>
                </div>
              </div>
            ))}
          </div>

          <div className="snpg-qs-shipping">
            <button className="snpg-qs-ship-opt">
              <span><Truck size={14} style={{ verticalAlign: 'middle', marginRight: 6 }}/> 금요일 도착 (AI 추천)</span>
              <span>+5,000</span>
            </button>
          </div>

          <div className="snpg-qs-total">
            <div>
              <div className="lbl">합계 (마켓용 일괄)</div>
            </div>
            <div className="price">{total.toLocaleString()}원</div>
          </div>

          <button className="snpg-qs-cta" onClick={onOrder}>
            🎪 4종 한 번에 주문하기 →
          </button>
        </div>
      </div>
    );
  }

  if (msg.type === 'order-complete') {
    return (
      <div className="snpg-msg bot" style={{ maxWidth: '100%' }}>
        <div className="snpg-complete">
          <div className="snpg-complete-icon">
            <Check size={32} strokeWidth={3} />
          </div>
          <h3>마켓에서 만나요!</h3>
          <p>주문번호 #2026-G0429 · 금요일 오전 도착</p>

          <div className="snpg-complete-stats">
            <div className="snpg-complete-stat">
              <div className="num">4</div>
              <div className="lbl">Goods</div>
            </div>
            <div className="snpg-complete-stat">
              <div className="num">14</div>
              <div className="lbl">Designs</div>
            </div>
            <div className="snpg-complete-stat">
              <div className="num">7'42"</div>
              <div className="lbl">Total Time</div>
            </div>
          </div>

          <div className="snpg-complete-saved">
            <Sparkles size={14} />
            'Bunny Doodle' 아트웍 → My IP 라이브러리에 저장됨
          </div>
        </div>
      </div>
    );
  }

  return null;
}


    ReactDOM.createRoot(document.getElementById('root')).render(<SnapsGoodsChat />);
  </script>
</body>
</html>
