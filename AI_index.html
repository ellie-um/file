<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 챗 프로토타입 — 스냅스코프</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #0A0A0A; color: #FAFAFA; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 640px; width: 100%; }
    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6B6B6B;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    h1 span { color: #FF4D1F; }
    .sub {
      font-size: 15px;
      color: #6B6B6B;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .cards { display: flex; flex-direction: column; gap: 12px; }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #141414;
      border: 1px solid #222;
      padding: 20px 24px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: #FF4D1F;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 77, 31, 0.08);
    }
    .card-icon {
      width: 48px; height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .card:nth-child(1) .card-icon { background: #FF6B35; }
    .card:nth-child(2) .card-icon { background: #C4756B; }
    .card:nth-child(3) .card-icon { background: #FF4D1F; }
    .card-text { flex: 1; }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 13px;
      color: #6B6B6B;
    }
    .card-arrow {
      font-size: 18px;
      color: #333;
      transition: color 0.2s;
    }
    .card:hover .card-arrow { color: #FF4D1F; }
    .footer {
      margin-top: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #333;
      text-align: center;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Snapscope · AI Chat Prototypes</div>
    <h1>AI 챗 <span>프로토타입</span></h1>
    <p class="sub">서비스별 AI 챗 기반 주문 플로우 인터랙티브 프로토타입</p>

    <div class="cards">
      <a class="card" href="snaps-goods-chat.html">
        <div class="card-icon">🎪</div>
        <div class="card-text">
          <div class="card-title">스냅스 · 굿즈 스튜디오</div>
          <div class="card-desc">마켓 출품용 굿즈 4종 일괄 주문 플로우</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <a class="card" href="snaps-photobook-chat.html">
        <div class="card-icon">📚</div>
        <div class="card-text">
          <div class="card-title">스냅스 · 포토북 AI 스튜디오</div>
          <div class="card-desc">847장 → 100p 포토북 자동 생성 플로우</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <a class="card" href="ohprint-card-chat.html">
        <div class="card-icon">📇</div>
        <div class="card-text">
          <div class="card-title">오프린트미 · 명함 AI 스튜디오</div>
          <div class="card-desc">지난 주문 불러오기 → 수정 → 익일배송 플로우</div>
        </div>
        <div class="card-arrow">→</div>
      </a>
    </div>

    <div class="footer">Built with React 18 + Babel Standalone · GitHub Pages Ready</div>
  </div>
</body>
</html>
